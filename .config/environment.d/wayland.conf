# Prefer Wayland for GTK and Qt, with X11 fallback for compatibility
GDK_BACKEND=wayland,x11
QT_QPA_PLATFORM=wayland;xcb

# Electron apps — auto-detect Wayland without needing per-app flags
ELECTRON_OZONE_PLATFORM_HINT=auto

# Route Qt apps through plasma-integration so they read kdeglobals — i.e. the
# HyprEarth colour scheme, fonts and cursor apply in the Hyprland session too,
# not just under Plasma. Plasma sets this itself; setting it here is what makes
# the two sessions look the same.
QT_QPA_PLATFORMTHEME=kde

# Ensure session type is set correctly
XDG_SESSION_TYPE=wayland
