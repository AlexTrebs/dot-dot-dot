# Hybrid Intel iGPU + NVIDIA dGPU environment.
#
# These lived in hypr/hyprland.conf as `env =` lines, which only ever reached
# the Hyprland session. Any other session (Plasma) started with none of them:
# VAAPI fell back to the wrong device and GBM had no NVIDIA backend. Moved here
# so the systemd user session exports them once and every session inherits.
#
# Hyprland still gets them: uwsm imports environment.d before launching the
# compositor. Cursor vars stay in hyprland.conf — HYPRCURSOR_* is Hyprland-only
# and Plasma sets its cursor through kcminputrc (see ./plasma_sync.sh).

LIBVA_DRIVER_NAME=iHD

# Address the iGPU by PCI path, not renderD128. renderD1xx numbering follows
# probe order and can swap between the Intel iGPU and the NVIDIA dGPU across
# kernel/driver bumps, which would silently send VAAPI to the wrong device.
LIBVA_DRI_DEVICE=/dev/dri/by-path/pci-0000:00:02.0-render

__GL_YIELD=NOTHING
GBM_BACKEND=nvidia-drm
