# Hybrid Intel iGPU + NVIDIA dGPU environment.
#
# Here rather than in the Hyprland config so Plasma gets them too (without them
# VAAPI picks the wrong device and GBM has no NVIDIA backend). Hyprland is not
# uwsm-managed, so hypr/lua/env.lua reads this file itself.
# Cursor vars stay in hypr/lua/env.lua — HYPRCURSOR_* is Hyprland-only
# and Plasma sets its cursor through kcminputrc (see ./plasma_sync.sh).

LIBVA_DRIVER_NAME=iHD

# Address the iGPU by PCI path, not renderD128. renderD1xx numbering follows
# probe order and can swap between the Intel iGPU and the NVIDIA dGPU across
# kernel/driver bumps, which would silently send VAAPI to the wrong device.
LIBVA_DRI_DEVICE=/dev/dri/by-path/pci-0000:00:02.0-render

__GL_YIELD=NOTHING
GBM_BACKEND=nvidia-drm
