# Toolkit environment for the Pi (labwc/Wayland).
#
# Mirrors the Arch box's wayland.conf, minus XDG_SESSION_TYPE — lightdm
# already sets that here, and overriding it confuses the session.
#
# QT_QPA_PLATFORMTHEME is the addition: without it Qt apps (VLC) ignore the
# GTK theming entirely and render in default light Fusion.

GDK_BACKEND=wayland,x11
QT_QPA_PLATFORM=wayland;xcb
QT_QPA_PLATFORMTHEME=qt5ct
ELECTRON_OZONE_PLATFORM_HINT=auto

# Let Qt pick up the same fractional-scaling behaviour as GTK
QT_AUTO_SCREEN_SCALE_FACTOR=1
