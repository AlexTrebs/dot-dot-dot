# Measurement config for comparing gamescope presentation paths.
# Averages hide stutter — the frametime graph and the 1%/0.1% lows are the
# numbers that decide whether a config feels good. Keep this identical across
# every test run or the comparisons mean nothing.

fps
frametime
frame_timing=1
fps_metrics=avg,1%,0.1%

gpu_stats
gpu_load_change
gpu_temp
cpu_stats
cpu_load_change
cpu_temp

# vram/ram help spot a swap-driven stutter that looks like a GPU problem
vram
ram

position=top-left
font_size=20
background_alpha=0.4

# Toggle overlay in-game; logs land in ~/.local/share/MangoHud/
toggle_hud=Shift_R+F12
output_folder=/home/alextrebs/.local/share/MangoHud
toggle_logging=Shift_L+F2
log_duration=60
autostart_log=0
