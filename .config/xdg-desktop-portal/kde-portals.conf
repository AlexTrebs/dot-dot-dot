# Overrides /usr/share/xdg-desktop-portal/kde-portals.conf for the Plasma
# session (xdg-desktop-portal picks the file matching XDG_CURRENT_DESKTOP, and
# ~/.config wins over /usr/share).
#
# Only the Secret line differs from the packaged file. The package routes
# org.freedesktop.impl.portal.Secret to kwallet, but ./plasma_sync.sh disables
# KWallet — only one process can own org.freedesktop.secrets, and gnome-keyring
# is the one both sessions share. Left as shipped, any sandboxed app asking the
# portal for a secret under Plasma talks to a backend that is never running.
#
# The other three lines are copied verbatim from the packaged file: this file
# replaces it rather than merging with it, so dropping them would lose the KDE
# settings and notification backends. Re-check them after a plasma upgrade.
#
# Unlike kdeglobals/kwinrc, nothing ever writes here, so this one is safe to
# symlink out of the repo.
[preferred]
default=kde
org.freedesktop.impl.portal.Settings=kde;gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.Notification=plasmanotify
