# Default panel = the HyperPixel touchscreen. Started by the SYSTEM autostart
# (lwrespawn wf-panel-pi), so it's always present even with no HDMI — this is
# what lets you restore the kiosk (window-list) after minimising standalone.
[panel]
monitor=DPI-1
widgets_left=smenu spacing0 spacing4 launchers spacing8 window-list
widgets_center=
# "squeek" (on-screen keyboard toggle) removed — squeekboard is disabled via
# ~/.config/autostart/squeekboard.desktop, so the button would do nothing.
widgets_right=tray power ejecter updater spacing2 connect spacing2 bluetooth spacing2 netman spacing2 volumepulse spacing2 clock spacing2 batt
# Launcher icons, left to right. Each entry is a .desktop filename from
# /usr/share/applications (or ~/.local/share/applications) WITHOUT the
# ".desktop" suffix — e.g. Alacritty.desktop -> Alacritty.
# List what's available with:  ls /usr/share/applications
launchers=x-www-browser Alacritty
# Earth Arch palette for the panel.
css_path=/home/alex/.config/wf-panel-pi/panel.css
position=bottom
icon_size=32
window-list_max_width=200
