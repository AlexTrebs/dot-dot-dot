# Second panel, bound to the HDMI desktop monitor.
#
# NOTE: monitor= is a PREFERENCE, not a binding — this instance DOES fall back
# onto the touchscreen when HDMI is absent, which is what caused the double top
# bar. It is therefore started/stopped by kanshi's profile exec lines
# (~/.config/kanshi/config -> ~/screen-control/hdmi-panel.sh), NOT by autostart.
[panel]
monitor=HDMI-A-2
widgets_left=smenu spacing0 spacing4 launchers spacing8 window-list
widgets_center=
# "squeek" (on-screen keyboard toggle) removed — see wf-panel-pi.ini.
widgets_right=tray power ejecter updater spacing2 connect spacing2 bluetooth spacing2 netman spacing2 volumepulse spacing2 clock spacing2 batt
launchers=x-www-browser pcmanfm Alacritty
# Earth Arch palette for the panel.
css_path=/home/alex/.config/wf-panel-pi/panel.css
position=top
icon_size=32
window-list_max_width=200
